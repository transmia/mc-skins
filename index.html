<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin Viewer</title>
<link rel="icon" type="image/png" href="https://api.mcskin.me/head/SirPigariYT?size=64">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    display: flex;
    height: 100dvh;
    overflow: hidden;
    background: #ffd6df;
    font-family: Verdana, Arial, sans-serif;
    font-size: 13px;
    color: #7a3a4a;
}
#sidebar {
    width: 200px;
    flex-shrink: 0;
    background: #f5d0d8;
    border-right: 1px solid #d4a0aa;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 1px;
}
#sidebar::-webkit-scrollbar { width: 5px; }
#sidebar::-webkit-scrollbar-thumb { background: #d4a0aa; border-radius: 3px; }
.skin-entry {
    padding: 8px 10px;
    cursor: pointer;
    color: #7a3a4a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
    transition: background 0.1s, border-color 0.1s;
    font-size: 12px;
}
.skin-entry:hover { background: #f9c0cb; border-color: #d4a0aa; }
.skin-entry.active { background: #f0a0b4; border-color: #d4a0aa; color: #5a2a3a; font-weight: bold; }
.skin-entry.error { color: #b08090; text-decoration: line-through; }
#empty-msg {
    color: #b08090;
    padding: 16px 8px;
    line-height: 1.8;
    font-size: 11px;
}
#viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff5f7;
    position: relative;
    min-width: 0;
}
#skin-canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
}
#status {
    position: absolute;
    bottom: 12px;
    font-size: 11px;
    color: #d4a0aa;
    pointer-events: none;
}
#error-msg {
    display: none;
    position: absolute;
    color: #a05060;
    font-size: 12px;
    text-align: center;
    padding: 0 20px;
}
@media (max-width: 900px) {
    body {
        display: grid;
        grid-template-rows: minmax(0, 1fr) 52px;
        grid-template-columns: minmax(0, 1fr);
    }
    #viewer {
        grid-row: 1;
        min-height: 0;
        min-width: 0;
    }
    #sidebar {
        grid-row: 2;
        width: 100%;
        height: 52px;
        min-width: 0;
        min-height: 0;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 6px 8px;
        gap: 4px;
        border-right: none;
        border-top: 1px solid #d4a0aa;
    }
    #sidebar::-webkit-scrollbar {
        height: 3px;
        width: auto;
    }
    .skin-entry {
        flex-shrink: 0;
        white-space: nowrap;
    }
}
</style>
</head>
<body>
<div id="sidebar">
    <div id="empty-msg">Loading skins...</div>
</div>
<div id="viewer">
    <canvas id="skin-canvas"></canvas>
    <div id="error-msg"></div>
    <div id="status">drag to rotate - scroll to zoom</div>
</div>
<script src="https://unpkg.com/skinview3d/bundles/skinview3d.bundle.js"></script>
<script>
const sidebar  = document.getElementById('sidebar');
const canvas   = document.getElementById('skin-canvas');
const viewerEl = document.getElementById('viewer');
const errorMsg = document.getElementById('error-msg');
const status   = document.getElementById('status');

let skinViewer = null;
let activeEntry = null;

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    canvas.style.display = 'none';
    status.style.display = 'none';
}

function clearError() {
    errorMsg.style.display = 'none';
    canvas.style.display = 'block';
    status.style.display = 'block';
}

function initViewer() {
    if (typeof skinview3d === 'undefined') {
        showError('skinview3d couldnt be loaded. Check your internet connection and refresh.');
        return false;
    }

    try {
        const w = Math.max(viewerEl.clientWidth - 40, 100);
        const h = Math.max(viewerEl.clientHeight - 40, 100);

        skinViewer = new skinview3d.SkinViewer({
            canvas,
            width: w,
            height: h
        });

        skinViewer.animation = null;
        skinViewer.controls.enableRotate = true;
        skinViewer.controls.enableZoom = true;
        skinViewer.controls.enablePan = false;
        skinViewer.renderer.setClearColor(0x000000, 0);

        return true;
    } catch (e) {
        showError('Failed to initialize viewer: ' + e.message);
        return false;
    }
}

function resizeViewer() {
    if (!skinViewer) return;

    skinViewer.setSize(
        Math.max(viewerEl.clientWidth - 40, 100),
        Math.max(viewerEl.clientHeight - 40, 100)
    );
}

window.addEventListener('resize', resizeViewer);

async function loadSkin(path, entry) {
    if (activeEntry) activeEntry.classList.remove('active');

    activeEntry = entry;
    entry.classList.add('active');

    clearError();

    if (!skinViewer && !initViewer()) return;

    try {
        await skinViewer.loadSkin(path);
        entry.classList.remove('error');
    } catch {
        entry.classList.add('error');
        showError('Could not load "' + entry.textContent + '".');
    }
}

function addSkin(path) {
    const entry = document.createElement('div');

    entry.className = 'skin-entry';
    entry.textContent = path.name;
    entry.title = path.name;

    entry.addEventListener('click', () => {
        loadSkin(path.download_url, entry);
    });

    sidebar.appendChild(entry);

    return entry;
}

async function loadSkinList() {
    try {
        const response = await fetch("https://api.github.com/repos/transmia/mc-skins/contents");

        if (!response.ok) {
            throw new Error('GitHub api returned http ' + response.status);
        }

        const files = await response.json();

        const skins = files.filter(file =>
            file.type === 'file' &&
            file.name.toLowerCase().endsWith('.png') &&
            file.download_url
        );

        sidebar.innerHTML = '';

        if (skins.length === 0) {
            const msg = document.createElement('div');
            msg.id = 'empty-msg';
            msg.textContent = 'No .png skins found in the repository.';
            sidebar.appendChild(msg);
            return;
        }

        skins.forEach(addSkin);

        const first = sidebar.querySelector('.skin-entry');
        if (first) loadSkin(skins[0].download_url, first);

    } catch (e) {
        sidebar.innerHTML = '';

        const msg = document.createElement('div');
        msg.id = 'empty-msg';
        msg.textContent = 'Failed to fetch skins: ' + e.message;
        sidebar.appendChild(msg);
    }
}

loadSkinList();
</script>
</body>
</html>
